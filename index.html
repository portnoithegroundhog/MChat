<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2P Text Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 10px; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Simple P2P Web Chat</h2>
  <div>
    <p><strong>Your Peer ID:</strong> <span id="my-id">Generating...</span></p>
    <input type="text" id="remote-id" placeholder="Paste Remote Peer ID">
    <button onclick="connectToPeer()">Connect</button>
  </div>
  <hr>
  <div id="chat-box"></div>
  <input type="text" id="message-input" placeholder="Type a message..." disabled>
  <button id="send-btn" onclick="sendMessage()" disabled>Send</button>

  <script>
    let peer = new Peer();
    let conn = null;

    // Display generated Peer ID
    peer.on('open', id => {
      document.getElementById('my-id').innerText = id;
    });

    // Handle incoming connections (User 2 connects to User 1)
    peer.on('connection', incomingConn => {
      conn = incomingConn;
      setupConnection();
    });

    // Initiate outgoing connection (User 1 connects to User 2)
    function connectToPeer() {
      const remoteId = document.getElementById('remote-id').value;
      conn = peer.connect(remoteId);
      setupConnection();
    }

    // Attach event listeners to the active data channel
    function setupConnection() {
      conn.on('open', () => {
        appendMessage("System", "Connected!");
        document.getElementById('message-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
      });

      conn.on('data', data => {
        appendMessage("Peer", data);
      });
    }

    // Send a message over the WebRTC data channel
    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value;
      if (text && conn) {
        conn.send(text);
        appendMessage("You", text);
        input.value = '';
      }
    }

    function appendMessage(sender, text) {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div class="msg"><strong>${sender}:</strong> ${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
